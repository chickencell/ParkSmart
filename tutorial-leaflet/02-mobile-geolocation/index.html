<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<!-- Stops mobile browsers from scaling the page -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<title>Mobile tutorial - Leaflet</title>

	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
		integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
		crossorigin=""/>
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
		integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
		crossorigin=""></script>

	<style>
		/* Fullscreen map */
		body {
			padding: 0;
			margin: 0;
		}
		html, body, #map {
			height: 100%;
			width: 100vw;
		}
	</style>
</head>
<body>

<div id="map"></div>

<script>
	// Start by showing the whole world
	var map = L.map('map').fitWorld();

	// NOTE: the tutorial uses tile.openstreetmap.org, but OpenStreetMap blocks pages
	// opened straight from a file, so I switched to CARTO's free OpenStreetMap-based tiles.
	L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
		subdomains: 'abcd',
		maxZoom: 19,
		attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
	}).addTo(map);

	// When the browser finds the user's location: add a marker and an accuracy circle
	function onLocationFound(e) {
		var radius = e.accuracy;

		L.marker(e.latlng).addTo(map)
			.bindPopup("You are within " + radius + " meters from this point").openPopup();

		L.circle(e.latlng, radius).addTo(map);
	}

	map.on('locationfound', onLocationFound);

	// If location is blocked or unavailable, show the error
	function onLocationError(e) {
		alert(e.message);
	}

	map.on('locationerror', onLocationError);

	// Ask the browser for the user's location and zoom to it (max zoom 16)
	map.locate({setView: true, maxZoom: 16});
</script>

</body>
</html>
